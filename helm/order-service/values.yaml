replicaCount: 2

image:
  repository: ghcr.io/rishabhagrawal287/microservices-platform-order-service
  tag: "28953b19845acc05fbedfc49c31fff266ab5e38b"
  pullPolicy: IfNotPresent

service:
  port: 8000

serviceMonitor:
  enabled: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

envFromSecret: platform-secrets

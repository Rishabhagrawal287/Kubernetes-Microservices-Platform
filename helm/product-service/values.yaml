replicaCount: 2

image:
  repository: ghcr.io/rishabhagrawal287/microservices-platform-product-service
  tag: "1773d50ce71c67d613c998ea821ad10002f0a5e0"
  pullPolicy: IfNotPresent

service:
  port: 9091

serviceMonitor:
  enabled: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

envFromSecret: platform-secrets

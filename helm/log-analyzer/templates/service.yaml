apiVersion: v1
kind: Service
metadata:
  name: log-analyzer
  labels:
    {{- include "log-analyzer.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "log-analyzer.labels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
